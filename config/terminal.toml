# Shell Shock Tool native terminal appearance
# Archivo editable por el usuario.

[appearance]
# acrylic = blur fuerte con tinte; blur = blur simple; glass = DWM clásico; solid = color plano.
backdrop = "acrylic"

# Opacidad del fondo con la ventana activa (0-100).
focused_opacity = 80

# Opacidad del fondo cuando SST pierde el foco (0-100).
unfocused_opacity = 0

# Color del tinte de fondo.
background_color = "#111629"

# Imagen de fondo. Vacío = desactivada.
# Puede ser una ruta absoluta o relativa a la carpeta de sst.exe.
background_image = ""

# Opacidad propia de la imagen (0-100).
# También se combina con focused_opacity/unfocused_opacity.
background_image_opacity = 100

# Radio de esquinas de la ventana en píxeles.
corner_radius = 16
