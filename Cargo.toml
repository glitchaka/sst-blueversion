[package]
name = "sst"
# Única fuente canónica de versión: releases, manifiestos y binarios derivan de este valor.
version = "0.1.9-blue.0"
edition = "2024"
description = "Portable Bash-compatible administration shell for Windows"

[dependencies]
anyhow = "1.0"
chrono = "0.4"
base64 = "0.22"
crossterm = "0.29"
dns-lookup = "2.0"
glob = "0.3"
zip = "0.6"
tar = "0.4"
flate2 = "1.1"
ipnet = "2.11"
rustyline = "17.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
similar = "2.7"
spellbook = "0.4.2"
snmp2 = "0.5.2"
sysinfo = "0.37"
vt100 = "0.16"
portable-pty = "0.9.0"
regex = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
image = "0.25"
fontdue = "0.9"
slint = { version = "1.14", default-features = false, features = ["backend-winit", "renderer-femtovg", "compat-1-2"] }
raw-window-handle = "0.6"
arboard = "3.6"
toml = "0.5.11"
argon2 = "0.5"
chacha20poly1305 = "0.10"
x25519-dalek = { version = "2", features = ["static_secrets"] }
rand_core = { version = "0.6", features = ["getrandom"] }
socket2 = "0.6"
ferrisetw = "1.2"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Printing",
    "Win32_NetworkManagement_NetManagement",
    "Win32_Security",
    "Win32_Security_Authentication_Identity",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Console",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Diagnostics_Etw",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_IO",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Pipes",
    "Win32_System_ProcessStatus",
    "Win32_System_Registry",
    "Win32_System_RemoteDesktop",
    "Win32_System_Services",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_System_WindowsProgramming",
    "Win32_UI_Controls",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(windows)'.build-dependencies]
winres = "0.1"

[[bin]]
name = "sst"
path = "src/main.rs"

[[bin]]
name = "sst_sfx_packager"
path = "src/bin/sst_sfx_packager.rs"

[[bin]]
name = "sst_sfx_stub"
path = "src/bin/sst_sfx_stub.rs"
