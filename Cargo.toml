[package]
name = "sst"
# Única fuente canónica de versión: releases, manifiestos y binarios derivan de este valor.
version = "0.1.9-blue.64"
edition = "2024"
description = "Portable Bash-compatible administration shell for Windows"

[dependencies]
libcaca = { package = "libcaca-rs", version = "0.1.0" }
anyhow = "1.0"
chrono = "0.4"
base64 = "0.22"
crossterm = "0.29"
dns-lookup = "2.0"
glob = "0.3"
zip = { version = "9.0.5", default-features = false, features = ["deflate"] }
tar = "0.4"
flate2 = "1.1"
ipnet = "2.11"
rustyline = "17.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
similar = "2.7"
spellbook = "0.4.2"
snmp2 = "0.5.2"
sysinfo = "0.37"
vt100 = "0.16"
portable-pty = "0.9.0"
regex = "1"
rusqlite = { version = "0.41.1", features = ["bundled", "fallible_uint"] }
toml = "0.5"
slint = { version = "1.18.1", default-features = false, features = ["std", "backend-winit", "renderer-femtovg", "compat-1-18", "raw-window-handle-06", "unstable-winit-030"] }
fontdue = "0.9.4"
arboard = "3.6.1"
argon2 = "0.5"
chacha20poly1305 = "0.10"
rand_core = { version = "0.6", features = ["getrandom"] }
x25519-dalek = { version = "2", features = ["static_secrets"] }
raw-window-handle = "0.6.2"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "bmp", "gif", "ico", "tiff"] }
socket2 = "0.6"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
opt-level = 3

[target.'cfg(windows)'.dependencies]
ferrisetw = "1.2"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation", "Win32_Globalization", "Win32_UI_WindowsAndMessaging", "Win32_UI_Controls",
    "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_Graphics_Gdi", "Win32_Graphics_Dwm", "Win32_Graphics_Printing",
    "Win32_System_LibraryLoader", "Win32_System_Console", "Win32_System_Threading",
    "Win32_System_Diagnostics_ToolHelp", "Win32_System_Pipes", "Win32_System_IO", "Win32_System_DataExchange",
    "Win32_System_Memory", "Win32_Security", "Win32_Storage_FileSystem",
    "Win32_System_Services", "Win32_Security_Authorization", "Win32_Security_Cryptography",
    "Win32_System_Com", "Win32_System_SystemServices", "Win32_Security_Credentials",
    "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_WiFi", "Win32_NetworkManagement_Ndis",
    "Win32_NetworkManagement_NetManagement", "Win32_Networking_WinSock",
] }

[target.'cfg(windows)'.build-dependencies]
winres = "0.1"
