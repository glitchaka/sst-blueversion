[target.x86_64-pc-windows-msvc]
linker = "rust-lld.exe"
rustflags = ["-C", "target-feature=+crt-static"]

[env]
# Canal oficial incorporado al binario. Puede sobreescribirse en terreno mediante
# SST_UPDATE_MANIFEST_URL o data/update-channel.txt sin recompilar SST.
SST_UPDATE_MANIFEST_URL = "https://raw.githubusercontent.com/glitchaka/sst-blueversion/main/updates/blue/sst-update.json"
