name: Sync SST version

on:
  push:
    branches: [main]
    paths:
      - Cargo.toml

permissions:
  contents: write

jobs:
  sync-version:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync Cargo.lock root package version
        shell: pwsh
        run: ./scripts/sync-version.ps1

      - name: Commit synchronized lockfile
        shell: pwsh
        run: |
          if (git diff --quiet -- Cargo.lock) {
            Write-Host 'Cargo.lock already synchronized.'
            exit 0
          }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Cargo.lock
          git commit -m 'chore: sync Cargo.lock SST version'
          git pull --rebase origin main
          git push origin HEAD:main
