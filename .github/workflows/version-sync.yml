name: Sync SST version

on:
  push:
    branches: [main]
    paths:
      - Cargo.toml
      - .github/workflows/version-sync.yml

permissions:
  contents: write

jobs:
  sync-version:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Synchronize root version
        shell: pwsh
        run: ./scripts/sync-version.ps1

      - name: Regenerate canonical Cargo.lock
        shell: pwsh
        run: cargo generate-lockfile

      - name: Commit canonical lockfile
        shell: pwsh
        run: |
          if (git diff --quiet -- Cargo.lock) {
            Write-Host 'Cargo.lock already canonical.'
            exit 0
          }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Cargo.lock
          git commit -m 'chore: synchronize canonical Cargo.lock'
          git pull --rebase origin main
          git push origin HEAD:main
