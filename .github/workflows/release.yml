name: Release SST

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Crear también la GitHub Release privada del repositorio fuente'
        required: true
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require main and public update publisher
        shell: pwsh
        env:
          UPDATE_TOKEN: ${{ secrets.SST_UPDATE_PUBLISH_TOKEN }}
        run: |
          if ('${{ github.ref }}' -ne 'refs/heads/main') {
            throw 'Las releases distribuibles de SST sólo pueden publicarse desde main.'
          }
          if ([string]::IsNullOrWhiteSpace($env:UPDATE_TOKEN)) {
            throw 'Falta el secret SST_UPDATE_PUBLISH_TOKEN con permiso Contents: Read and write sobre glitchaka/adm-toolbox.'
          }

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Synchronize version metadata
        shell: pwsh
        run: ./scripts/sync-version.ps1

      - name: Read canonical version
        id: version
        shell: pwsh
        run: |
          $text = Get-Content -Raw Cargo.toml
          $m = [regex]::Match($text, '(?m)^version\s*=\s*"([^"]+)"\s*$')
          if (-not $m.Success) { throw 'No se pudo leer la versión canónica.' }
          "version=$($m.Groups[1].Value)" >> $env:GITHUB_OUTPUT

      - name: Refuse version reuse on different code
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $tag = "v$env:VERSION"
          git fetch --tags --force
          git rev-parse --verify --quiet "refs/tags/$tag" *> $null
          if ($LASTEXITCODE -eq 0) {
            $tagCommit = (git rev-list -n 1 $tag).Trim()
            if ($tagCommit -ne $env:GITHUB_SHA) {
              throw "La versión $env:VERSION ya fue publicada desde $tagCommit. Aumente la versión de Cargo.toml antes de publicar código distinto."
            }
            Write-Host "La versión $env:VERSION ya pertenece a este mismo commit; se permite reintentar el empaquetado."
          }

      - name: Build SST, native SFX packager and stub
        shell: pwsh
        run: cargo build --release --bin sst --bin sst_sfx_packager --bin sst_sfx_stub

      - name: Package final self-extracting release
        shell: pwsh
        run: ./scripts/package-release.ps1

      - name: Verify final self-extractor by executing a disposable copy
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $setup = Join-Path $PWD "dist/SST-Setup-$env:VERSION.exe"
          $verifySetup = Join-Path $env:RUNNER_TEMP "SST-Setup-$env:VERSION-verify.exe"
          $extract = Join-Path $env:RUNNER_TEMP 'sst-release-verify'
          if (Test-Path -LiteralPath $extract) { Remove-Item -Recurse -Force -LiteralPath $extract }
          if (Test-Path -LiteralPath $verifySetup) { Remove-Item -Force -LiteralPath $verifySetup }
          Copy-Item -LiteralPath $setup -Destination $verifySetup

          $arguments = '--extract-only "' + $extract + '"'
          $process = Start-Process -FilePath $verifySetup -ArgumentList $arguments -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            throw "El autoextraible terminó con código $($process.ExitCode)"
          }

          $extracted = Join-Path $extract 'sst.exe'
          if (-not (Test-Path -LiteralPath $extracted -PathType Leaf)) {
            throw 'El autoextraible no extrajo sst.exe'
          }

          $expected = (Get-FileHash -Algorithm SHA256 -LiteralPath 'dist/sst.exe').Hash
          $actual = (Get-FileHash -Algorithm SHA256 -LiteralPath $extracted).Hash
          if ($expected -ne $actual) {
            throw "sst.exe extraído no coincide: $actual != $expected"
          }

          $deadline = [DateTime]::UtcNow.AddSeconds(15)
          while ((Test-Path -LiteralPath $verifySetup) -and [DateTime]::UtcNow -lt $deadline) {
            Start-Sleep -Milliseconds 250
          }
          if (Test-Path -LiteralPath $verifySetup) {
            throw 'La copia de verificación del autoextraible no se autoeliminó.'
          }
          if (-not (Test-Path -LiteralPath $setup -PathType Leaf)) {
            throw 'La verificación consumió el artefacto original de distribución.'
          }

      - name: Upload private workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: SST-${{ steps.version.outputs.version }}
          path: dist/*
          if-no-files-found: error

      - name: Publish public update payload
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.SST_UPDATE_PUBLISH_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
          UPDATE_REPO: glitchaka/adm-toolbox
        run: |
          $tag = "sst-v$env:VERSION"
          $notes = ".release/v$env:VERSION.md"
          $setup = "dist/SST-Setup-$env:VERSION.exe"

          gh release view $tag --repo $env:UPDATE_REPO *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release edit $tag --repo $env:UPDATE_REPO --title "SST $env:VERSION" --notes-file $notes
          } else {
            gh release create $tag --repo $env:UPDATE_REPO --target main --title "SST $env:VERSION" --notes-file $notes
          }

          gh release upload $tag --repo $env:UPDATE_REPO dist/sst.exe $setup --clobber
          if ($LASTEXITCODE -ne 0) {
            throw 'No se pudo publicar el payload público de actualización.'
          }

      - name: Verify public update payload
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $manifest = Get-Content -Raw -LiteralPath 'dist/sst-update.json' | ConvertFrom-Json
          $download = Join-Path $env:RUNNER_TEMP "sst-$env:VERSION-public.exe"
          if (Test-Path -LiteralPath $download) { Remove-Item -Force -LiteralPath $download }

          & curl.exe -L --fail --silent --show-error --proto '=https' --tlsv1.2 `
              --connect-timeout 10 --max-time 180 `
              $manifest.asset_url -o $download
          if ($LASTEXITCODE -ne 0) {
            throw 'El binario público no pudo descargarse desde la URL del manifiesto.'
          }

          $expectedHash = $manifest.sha256.ToLowerInvariant()
          $actualHash = (Get-FileHash -Algorithm SHA256 -LiteralPath $download).Hash.ToLowerInvariant()
          if ($actualHash -ne $expectedHash) {
            throw "SHA-256 público incorrecto: $actualHash != $expectedHash"
          }
          if ((Get-Item -LiteralPath $download).Length -ne [int64]$manifest.size) {
            throw 'El tamaño del binario público no coincide con el manifiesto.'
          }

          Write-Host "Payload público verificado: $($manifest.asset_url)"

      - name: Publish update manifest last
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.SST_UPDATE_PUBLISH_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
          UPDATE_REPO: glitchaka/adm-toolbox
        run: |
          $path = 'updates/blue/sst-update.json'
          $current = gh api "repos/$env:UPDATE_REPO/contents/$path?ref=main" | ConvertFrom-Json
          if (-not $current.sha) {
            throw 'No se pudo obtener el SHA del manifiesto público actual.'
          }

          $manifestBytes = [System.IO.File]::ReadAllBytes((Join-Path $PWD 'dist/sst-update.json'))
          $encoded = [Convert]::ToBase64String($manifestBytes)
          $payload = [ordered]@{
            message = "Publish SST $env:VERSION update channel"
            content = $encoded
            sha = $current.sha
            branch = 'main'
          } | ConvertTo-Json

          $request = Join-Path $env:RUNNER_TEMP 'sst-manifest-publish.json'
          [System.IO.File]::WriteAllText(
            $request,
            $payload,
            (New-Object System.Text.UTF8Encoding($false))
          )

          gh api --method PUT "repos/$env:UPDATE_REPO/contents/$path" --input $request > $null
          if ($LASTEXITCODE -ne 0) {
            throw 'El payload quedó publicado, pero no se pudo activar el manifiesto del canal.'
          }

          Write-Host "Canal blue activado en SST $env:VERSION"

      - name: Create or refresh private source release
        if: ${{ inputs.publish_release }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $tag = "v$env:VERSION"
          $notes = ".release/$tag.md"
          if (-not (Test-Path -LiteralPath $notes)) {
            throw "Faltan notas de release: $notes"
          }

          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release edit $tag --title "Shell Shock Tool $env:VERSION" --notes-file $notes
          } else {
            gh release create $tag --target $env:GITHUB_SHA --title "Shell Shock Tool $env:VERSION" --notes-file $notes
          }

          gh release upload $tag dist/sst.exe dist/sst-update.json dist/version.txt "dist/SST-Setup-$env:VERSION.exe" --clobber
