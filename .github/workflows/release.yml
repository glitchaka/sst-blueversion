name: Release SST

on:
  workflow_dispatch:
    inputs:
      update_manifest_url:
        description: 'URL HTTPS pública y estable de sst-update.json (opcional mientras se prueba)'
        required: false
        type: string
        default: ''
      publish_release:
        description: 'Crear/actualizar también la GitHub Release privada del repositorio fuente'
        required: true
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Synchronize version metadata
        shell: pwsh
        run: ./scripts/sync-version.ps1

      - name: Build SST and self-extractor stub
        shell: pwsh
        run: cargo build --release --bin sst --bin sst_setup

      - name: Package release
        shell: pwsh
        run: ./scripts/package-release.ps1 -UpdateManifestUrl '${{ inputs.update_manifest_url }}'

      - name: Read canonical version
        id: version
        shell: pwsh
        run: |
          $text = Get-Content -Raw Cargo.toml
          $m = [regex]::Match($text, '(?m)^version\s*=\s*"([^"]+)"\s*$')
          if (-not $m.Success) { throw 'No se pudo leer la versión canónica.' }
          "version=$($m.Groups[1].Value)" >> $env:GITHUB_OUTPUT

      - name: Upload distribution artifact
        uses: actions/upload-artifact@v4
        with:
          name: SST-${{ steps.version.outputs.version }}
          path: dist/*
          if-no-files-found: error

      - name: Create or update private source release
        if: ${{ inputs.publish_release }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $tag = "v$env:VERSION"
          $notes = ".release/$tag.md"
          if (-not (Test-Path -LiteralPath $notes)) {
            $notes = Join-Path $env:RUNNER_TEMP 'release-notes.md'
            "Shell Shock Tool $env:VERSION" | Set-Content -Encoding utf8 -LiteralPath $notes
          }

          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release edit $tag --title "Shell Shock Tool $env:VERSION" --notes-file $notes
          } else {
            gh release create $tag --target $env:GITHUB_SHA --title "Shell Shock Tool $env:VERSION" --notes-file $notes
          }

          gh release upload $tag dist/sst.exe dist/sst-update.json dist/version.txt "dist/SST-Setup-$env:VERSION.exe" --clobber
