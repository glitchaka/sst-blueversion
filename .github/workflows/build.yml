name: build

# Deliberately operator-triggered: SST's development policy keeps compilation
# and tests under explicit control instead of running on every source push.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.qa/full-build.trigger'
      - '.github/workflows/build.yml'

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test

      - name: Build
        run: cargo build
