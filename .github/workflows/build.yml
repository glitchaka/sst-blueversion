name: build

# Deliberately operator-triggered: SST's development policy keeps compilation
# and tests under explicit control instead of running on every source push.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.qa/full-build.trigger'
      - '.github/workflows/build.yml'

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Prepare pinned IEEE registry for reproducible build
        shell: pwsh
        run: |
          $rev = '65f556005f63a22ae353e6f129440dbdb3c29c06'
          $dir = Join-Path $env:RUNNER_TEMP 'sst-ieee'
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          $items = @(
            @{ Name = 'oui.csv'; Env = 'SST_IEEE_MAL_CSV' },
            @{ Name = 'mam.csv'; Env = 'SST_IEEE_MAM_CSV' },
            @{ Name = 'oui36.csv'; Env = 'SST_IEEE_MAS_CSV' }
          )
          foreach ($item in $items) {
            $target = Join-Path $dir $item.Name
            $url = "https://raw.githubusercontent.com/StewAlexander-com/maclookup.py/$rev/$($item.Name)"
            & curl.exe -L --fail --silent --show-error --retry 3 --retry-all-errors --connect-timeout 8 --max-time 120 $url -o $target
            if ($LASTEXITCODE -ne 0 -or -not (Test-Path -LiteralPath $target)) {
              throw "No se pudo preparar $($item.Name) para el build"
            }
            if ((Get-Item -LiteralPath $target).Length -lt 10000) {
              throw "El registro $($item.Name) descargado parece incompleto"
            }
            "$($item.Env)=$target" >> $env:GITHUB_ENV
          }


      - name: Format (advisory until legacy files are normalized)
        continue-on-error: true
        run: cargo fmt --all -- --check

      - name: Clippy (advisory until legacy lint debt is normalized)
        continue-on-error: true
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Test
        id: test
        shell: pwsh
        run: |
          cargo test --workspace --all-targets *> cargo-test.log
          if ($LASTEXITCODE -ne 0) {
            Get-Content cargo-test.log -Tail 80
            throw 'Rust test failed.'
          }

      - name: Build
        id: build
        shell: pwsh
        run: |
          cargo build --release --bin sst *> cargo-build.log
          if ($LASTEXITCODE -ne 0) {
            Get-Content cargo-build.log -Tail 100
            throw 'Windows release build failed.'
          }

      - name: Write verifiable Windows build result to main
        if: always()
        shell: pwsh
        env:
          TEST_OUTCOME: ${{ steps.test.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path .qa | Out-Null
          $logPath = if ($env:BUILD_OUTCOME -eq 'failure') { 'cargo-build.log' }
            elseif ($env:TEST_OUTCOME -eq 'failure') { 'cargo-test.log' }
            else { '' }
          $tail = if ($logPath -and (Test-Path $logPath)) {
            (Get-Content $logPath -Tail 55) -join "`n"
          } else { 'No failed compiler/test log.' }
          @"
          Commit: $env:GITHUB_SHA
          Tested UTC: $([DateTime]::UtcNow.ToString('u'))
          Test: $env:TEST_OUTCOME
          Windows release build: $env:BUILD_OUTCOME
          Log tail:
          $tail
          "@ | Set-Content -LiteralPath .qa/windows-build-result.txt -Encoding UTF8
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .qa/windows-build-result.txt
          git commit -m "ci: record Windows test and build result [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Verify GUI software renderer launch
        shell: pwsh
        run: ./scripts/test-software-renderer.ps1 -Exe ./target/debug/sst.exe
