name: SST self-update regression

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'src/presentation/gui_slint_wrapper.rs'
      - 'src/presentation/gui_slint.rs'
      - 'src/builtins/sudo.rs'
      - 'src/builtins/mod.rs'
      - 'src/application/update.rs'
      - 'src/bin/sst_updater.rs'
      - 'src/core/bash/interpreter.rs'
      - 'src/core/bash/diagnostic_tests.rs'
      - 'src/core/bash/mod.rs'
      - 'src/application/system.rs'
      - 'examples/11-diagnostico-interactivo.sh'
      - 'src/adapters/shell/native_engine.rs'
      - 'scripts/test-nwash-process-substitution.ps1'
      - 'scripts/test-independent-updater.ps1'
      - 'scripts/test-self-update.ps1'
      - 'scripts/test-self-update-failures.ps1'
      - '.github/workflows/self-update-regression.yml'

permissions:
  contents: read

jobs:
  self-update:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Synchronize version metadata
        shell: pwsh
        run: ./scripts/sync-version.ps1

      - name: Prepare pinned IEEE registry
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $rev = '65f556005f63a22ae353e6f129440dbdb3c29c06'
          $dir = Join-Path $env:RUNNER_TEMP 'sst-ieee'
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          $items = @(
            @{ Name = 'oui.csv'; Env = 'SST_IEEE_MAL_CSV' },
            @{ Name = 'mam.csv'; Env = 'SST_IEEE_MAM_CSV' },
            @{ Name = 'oui36.csv'; Env = 'SST_IEEE_MAS_CSV' }
          )
          foreach ($item in $items) {
            $target = Join-Path $dir $item.Name
            $url = "https://raw.githubusercontent.com/StewAlexander-com/maclookup.py/$rev/$($item.Name)"
            & curl.exe -L --fail --silent --show-error --retry 3 --retry-all-errors --connect-timeout 8 --max-time 120 $url -o $target
            if ($LASTEXITCODE -ne 0 -or -not (Test-Path -LiteralPath $target -PathType Leaf)) {
              throw "No se pudo preparar $($item.Name)"
            }
            "$($item.Env)=$target" >> $env:GITHUB_ENV
          }

      - name: Build SST for updater regression
        shell: pwsh
        run: cargo build --bin sst --bin sst_updater

      - name: Exercise real self-update handoff
        shell: pwsh
        run: ./scripts/test-self-update.ps1 -SstPath ./target/debug/sst.exe

      - name: Exercise updater failure matrix
        shell: pwsh
        run: ./scripts/test-self-update-failures.ps1 -SstPath ./target/debug/sst.exe

      - name: Exercise real Windows Bash process substitution and read EOF
        shell: pwsh
        run: ./scripts/test-nwash-process-substitution.ps1 -SstPath ./target/debug/sst.exe

      - name: Exercise native NOTSH contexts (Windows APIs)
        shell: pwsh
        run: ./scripts/test-notsh-native.ps1 -SstPath ./target/debug/sst.exe

      - name: Exercise native printer and top-memory process reports
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # The native SST GUI subsystem does not always attach stdout in
          # Windows runner PowerShell. Exercise through a Bash script file,
          # with both commands and output checks inside the same Nwash shell.
          $fixture = Join-Path $env:RUNNER_TEMP 'sst-native-diagnostics.sh'
          $output = Join-Path $env:RUNNER_TEMP 'sst-native-diagnostics.out'
          $errorLog = Join-Path $env:RUNNER_TEMP 'sst-native-diagnostics.err'
          [IO.File]::WriteAllText($fixture, @'
          sys processes --sort ram --top 8
          sys printers
          '@, [Text.UTF8Encoding]::new($false))
          $job = Start-Process -FilePath ./target/debug/sst.exe -ArgumentList $fixture -PassThru -Wait -RedirectStandardOutput $output -RedirectStandardError $errorLog
          $result = Get-Content -Raw -LiteralPath $output
          $errors = Get-Content -Raw -LiteralPath $errorLog
          if ($job.ExitCode -ne 0) {
            throw "Diagnóstico nativo terminó con estado $($job.ExitCode): $errors | $result"
          }
          if ($result -notmatch 'PID\s+PPID\s+CPU%\s+RAM MiB') {
            throw "Falta tabla de procesos: $result"
          }
          if ($result -notmatch 'IMPRESORAS|No hay impresoras') {
            throw "Falta informe de impresoras: $result"
          }

      - name: Exercise independent updater with error injection
        shell: pwsh
        run: ./scripts/test-independent-updater.ps1 -UpdaterPath ./target/debug/sst_updater.exe
