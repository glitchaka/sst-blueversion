name: SST terminal black-box and stress

on:
  workflow_dispatch:
    inputs:
      stress_scale:
        description: 'Multiplicador de estrés (1 normal, 2+ agresivo)'
        required: true
        default: '1'
  push:
    branches: [main]
    paths:
      - '.qa/terminal-blackbox.trigger'
      - 'scripts/terminal_blackbox_stress.py'
      - 'scripts/gui_idle_resource_probe.ps1'
      - '.github/workflows/terminal-blackbox-stress.yml'

permissions:
  contents: read

jobs:
  terminal-blackbox:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Synchronize version metadata
        shell: pwsh
        run: ./scripts/sync-version.ps1

      - name: Prepare pinned IEEE registry for reproducible build
        shell: pwsh
        run: |
          $rev = '65f556005f63a22ae353e6f129440dbdb3c29c06'
          $dir = Join-Path $env:RUNNER_TEMP 'sst-ieee'
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          $items = @(
            @{ Name = 'oui.csv'; Env = 'SST_IEEE_MAL_CSV' },
            @{ Name = 'mam.csv'; Env = 'SST_IEEE_MAM_CSV' },
            @{ Name = 'oui36.csv'; Env = 'SST_IEEE_MAS_CSV' }
          )
          foreach ($item in $items) {
            $target = Join-Path $dir $item.Name
            $url = "https://raw.githubusercontent.com/StewAlexander-com/maclookup.py/$rev/$($item.Name)"
            & curl.exe -L --fail --silent --show-error --retry 3 --retry-all-errors --connect-timeout 8 --max-time 120 $url -o $target
            if ($LASTEXITCODE -ne 0 -or -not (Test-Path -LiteralPath $target)) {
              throw "No se pudo preparar $($item.Name) para el build"
            }
            if ((Get-Item -LiteralPath $target).Length -lt 10000) {
              throw "El registro $($item.Name) descargado parece incompleto"
            }
            "$($item.Env)=$target" >> $env:GITHUB_ENV
          }

      - name: Compile all test targets
        shell: pwsh
        run: cargo test --workspace --all-targets --no-run

      - name: Run Rust test suite
        id: rust_tests
        continue-on-error: true
        shell: pwsh
        run: cargo test --workspace --all-targets

      - name: Build release SST
        shell: pwsh
        run: cargo build --release --bin sst

      - name: Measure GUI idle CPU and memory
        id: gui_resources
        continue-on-error: true
        shell: pwsh
        run: ./scripts/gui_idle_resource_probe.ps1 -Exe ./target/release/sst.exe

      - name: Run terminal black-box and stress suite
        id: blackbox
        continue-on-error: true
        shell: pwsh
        env:
          INPUT_STRESS_SCALE: ${{ github.event.inputs.stress_scale }}
        run: |
          $scale = 1
          if (-not [string]::IsNullOrWhiteSpace($env:INPUT_STRESS_SCALE)) {
            $scale = [int]$env:INPUT_STRESS_SCALE
          }
          python ./scripts/terminal_blackbox_stress.py --exe ./target/release/sst.exe --stress-scale $scale

      - name: Upload QA report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sst-terminal-blackbox-report
          path: qa-results/*
          if-no-files-found: warn

      - name: Enforce complete QA result
        if: always()
        shell: pwsh
        env:
          RUST_OUTCOME: ${{ steps.rust_tests.outcome }}
          GUI_RESOURCE_OUTCOME: ${{ steps.gui_resources.outcome }}
          BLACKBOX_OUTCOME: ${{ steps.blackbox.outcome }}
        run: |
          $failed = @()
          if ($env:RUST_OUTCOME -ne 'success') { $failed += "Rust tests: $env:RUST_OUTCOME" }
          if ($env:GUI_RESOURCE_OUTCOME -ne 'success') { $failed += "GUI resources: $env:GUI_RESOURCE_OUTCOME" }
          if ($env:BLACKBOX_OUTCOME -ne 'success') { $failed += "Black-box/stress: $env:BLACKBOX_OUTCOME" }
          if ($failed.Count -gt 0) {
            throw ($failed -join '; ')
          }
