name: SST live guide regression

on:
  push:
    branches: [main]
    paths:
      - 'scripts/test-live-guide.py'
      - '.github/workflows/guide-live-regression.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  guide-live:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Validate live guide and every Arch package detail
        run: python3 ./scripts/test-live-guide.py
