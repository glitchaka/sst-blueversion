name: SST offline guide regression

on:
  push:
    branches: [main]
    paths:
      - 'guide/**'
      - 'scripts/test-offline-guide.py'
      - 'src/builtins/guide_new.rs'
      - 'src/builtins/guide_remote.rs'
      - 'src/adapters/persistence/paths.rs'
      - 'build.rs'
      - 'scripts/package-release.ps1'
      - '.github/workflows/guide-live-regression.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  guide-offline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Validate all offline SST manual references and hidden Arch menu
        run: python3 ./scripts/test-offline-guide.py
