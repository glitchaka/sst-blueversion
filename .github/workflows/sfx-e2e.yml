name: Verify SST self-extractor

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sfx-e2e:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Synchronize version metadata locally
        shell: pwsh
        run: ./scripts/sync-version.ps1

      - name: Build SST, native SFX packager and stub
        shell: pwsh
        run: cargo build --release --bin sst --bin sst_sfx_packager --bin sst_sfx_stub

      - name: Build final self-extractor
        shell: pwsh
        run: ./scripts/package-release.ps1 -UpdateManifestUrl 'https://example.invalid/sst-update.json'

      - name: Execute single-use self-extractor end to end
        shell: pwsh
        run: |
          $version = (Get-Content -Raw dist/version.txt).Trim()
          $setup = Join-Path $PWD "dist/SST-Setup-$version.exe"
          $first = Join-Path $env:RUNNER_TEMP 'SST-Setup-first.exe'
          $second = Join-Path $env:RUNNER_TEMP 'SST-Setup-second.exe'
          $extract = Join-Path $env:RUNNER_TEMP 'sst-sfx-extracted'
          $extractSecond = Join-Path $env:RUNNER_TEMP 'sst-sfx-second'

          foreach ($path in @($first, $second, $extract, $extractSecond)) {
            if (Test-Path -LiteralPath $path) { Remove-Item -Recurse -Force -LiteralPath $path }
          }

          $setupBytes = (Get-Item -LiteralPath $setup).Length
          Copy-Item -LiteralPath $setup -Destination $first
          Copy-Item -LiteralPath $setup -Destination $second

          $arguments = '--extract-only "' + $extract + '"'
          $process = Start-Process -FilePath $first -ArgumentList $arguments -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            throw "La primera extracción terminó con código $($process.ExitCode)"
          }

          $extracted = Join-Path $extract 'sst.exe'
          if (-not (Test-Path -LiteralPath $extracted -PathType Leaf)) {
            throw 'El autoextraible se ejecutó pero no extrajo sst.exe'
          }

          $expectedHash = (Get-FileHash -Algorithm SHA256 -LiteralPath 'dist/sst.exe').Hash
          $actualHash = (Get-FileHash -Algorithm SHA256 -LiteralPath $extracted).Hash
          if ($expectedHash -ne $actualHash) {
            throw "sst.exe extraído no coincide con el empaquetado: $actualHash != $expectedHash"
          }

          $sstBytes = (Get-Item -LiteralPath $extracted).Length
          if ($setupBytes -le 1MB -or $sstBytes -le 1MB) {
            throw "Tamaños inesperados: setup=$setupBytes sst=$sstBytes"
          }

          $deadline = [DateTime]::UtcNow.AddSeconds(15)
          while ((Test-Path -LiteralPath $first) -and [DateTime]::UtcNow -lt $deadline) {
            Start-Sleep -Milliseconds 250
          }
          if (Test-Path -LiteralPath $first) {
            throw 'El primer autoextraible no se autoeliminó después de la extracción.'
          }

          $secondArguments = '--extract-only "' + $extractSecond + '"'
          $secondProcess = Start-Process -FilePath $second -ArgumentList $secondArguments -Wait -PassThru
          if ($secondProcess.ExitCode -eq 0) {
            throw 'Una segunda copia del mismo paquete consiguió extraerse por segunda vez.'
          }
          if (Test-Path -LiteralPath (Join-Path $extractSecond 'sst.exe')) {
            throw 'La segunda ejecución dejó un sst.exe pese a que el paquete ya estaba consumido.'
          }

          $deadline = [DateTime]::UtcNow.AddSeconds(15)
          while ((Test-Path -LiteralPath $second) -and [DateTime]::UtcNow -lt $deadline) {
            Start-Sleep -Milliseconds 250
          }
          if (Test-Path -LiteralPath $second) {
            throw 'La copia reutilizada no se autoeliminó.'
          }

          if (-not (Test-Path -LiteralPath $setup -PathType Leaf)) {
            throw 'La verificación consumió el artefacto original de dist en lugar de una copia de prueba.'
          }

          Write-Host "SFX single-use OK: $setup"
          Write-Host "Setup bytes: $setupBytes"
          Write-Host "Extracted sst.exe SHA-256: $actualHash"

      - name: Upload verified self-extractor
        uses: actions/upload-artifact@v4
        with:
          name: SST-self-extractor-${{ github.sha }}
          path: |
            dist/SST-Setup-*.exe
            dist/sst-update.json
            dist/version.txt
          if-no-files-found: error
