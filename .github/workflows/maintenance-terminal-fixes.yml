name: Apply terminal fixes once

on:
  push:
    branches: [main]
    paths:
      - '.maintenance/terminal-fixes.trigger'

permissions:
  contents: write

jobs:
  apply:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply final updater process-exit fix
        shell: pwsh
        run: python .maintenance/postfix_terminal_update_exit.py

      - name: Commit and push fix before validation
        shell: pwsh
        run: |
          git config user.name 'sst-maintenance-bot'
          git config user.email 'sst-maintenance@users.noreply.github.com'
          git add src/adapters/terminal/embedded.rs
          git diff --cached --check
          git commit -m 'Let updater release executable before swap'
          git push origin HEAD:main

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Validate after push
        shell: pwsh
        run: |
          cargo fmt --check
          cargo test --workspace --all-targets
          cargo build --release --bin sst
