name: Apply terminal fixes once

on:
  push:
    branches: [main]
    paths:
      - '.maintenance/terminal-fixes.trigger'

permissions:
  contents: write

jobs:
  apply:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fix QA harness false positives
        shell: pwsh
        run: python .maintenance/fix_qa_harness.py

      - name: Commit and push harness fix
        shell: pwsh
        run: |
          git config user.name 'sst-maintenance-bot'
          git config user.email 'sst-maintenance@users.noreply.github.com'
          git add scripts/terminal_blackbox_stress.py
          git diff --cached --check
          git commit -m 'Fix terminal QA false positives'
          git push origin HEAD:main
