# release attempt 3
name: Build SST update once

on:
  push:
    branches: [main]
    paths:
      - '.release/build-0.1.9-blue.5.trigger'
      - '.github/workflows/build-update-once.yml'

permissions:
  contents: read

jobs:
  build-update:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Prepare IEEE OUI registries
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $gzPath = Join-Path $env:RUNNER_TEMP 'oui.txt.gz'
          $txtPath = Join-Path $env:RUNNER_TEMP 'oui.txt'
          Invoke-WebRequest -Uri 'https://raw.githubusercontent.com/evcc-io/evcc/master/util/discovery/oui.txt.gz' -OutFile $gzPath

          $input = [System.IO.File]::OpenRead($gzPath)
          try {
            $gzip = [System.IO.Compression.GzipStream]::new($input, [System.IO.Compression.CompressionMode]::Decompress)
            try {
              $output = [System.IO.File]::Create($txtPath)
              try { $gzip.CopyTo($output) } finally { $output.Dispose() }
            } finally { $gzip.Dispose() }
          } finally { $input.Dispose() }

          $mal = Join-Path $env:RUNNER_TEMP 'ieee-ma-l.csv'
          $mam = Join-Path $env:RUNNER_TEMP 'ieee-ma-m.csv'
          $mas = Join-Path $env:RUNNER_TEMP 'ieee-ma-s.csv'
          $header = 'Registry,Assignment,Organization Name,Organization Address'
          Set-Content -LiteralPath $mal -Value $header -Encoding utf8
          Set-Content -LiteralPath $mam -Value $header -Encoding utf8
          Set-Content -LiteralPath $mas -Value $header -Encoding utf8

          Get-Content -LiteralPath $txtPath | ForEach-Object {
            if ([string]::IsNullOrWhiteSpace($_)) { return }
            $parts = $_ -split "`t", 2
            if ($parts.Count -ne 2) { return }
            $prefix = $parts[0].Trim().ToUpperInvariant()
            $org = $parts[1].Replace('"', '""')
            $row = $null
            $target = $null
            switch ($prefix.Length) {
              6 { $row = 'MA-L,' + $prefix + ',"' + $org + '",""'; $target = $mal }
              7 { $row = 'MA-M,' + $prefix + ',"' + $org + '",""'; $target = $mam }
              9 { $row = 'MA-S,' + $prefix + ',"' + $org + '",""'; $target = $mas }
            }
            if ($target) { Add-Content -LiteralPath $target -Value $row -Encoding utf8 }
          }

          "SST_IEEE_MAL_CSV=$mal" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "SST_IEEE_MAM_CSV=$mam" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "SST_IEEE_MAS_CSV=$mas" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Build SST release
        run: cargo build --release --bin sst
      - name: Upload SST update binary
        uses: actions/upload-artifact@v4
        with:
          name: sst-update-0.1.9-blue.5
          path: target/release/sst.exe
          if-no-files-found: error
