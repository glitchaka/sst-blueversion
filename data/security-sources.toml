# SST security intelligence source registry
# Este archivo es deliberadamente editable.
# Una fuente puede deshabilitarse o reemplazarse sin recompilar SST.
#
# Las claves/API tokens NO deben almacenarse aquí.
# auth_env indica qué variable de entorno debe leer SST.

[[source]]
id = "malwarebazaar"
enabled = true
kind = "hash_reputation"
base_url = "https://mb-api.abuse.ch/api/v1/"
lookup = "sha256"
auth = "header"
auth_env = "SST_MALWAREBAZAAR_AUTH_KEY"
timeout_ms = 2500
cache_ttl_hours = 24
priority = 10
notes = "Reputación y metadata de muestras por hash. Community API puede requerir Auth-Key."

[[source]]
id = "threatfox"
enabled = true
kind = "ioc_reputation"
base_url = "https://threatfox-api.abuse.ch/api/v1/"
lookup = "ioc"
auth = "header"
auth_env = "SST_THREATFOX_AUTH_KEY"
timeout_ms = 2500
cache_ttl_hours = 12
priority = 20
notes = "IOC: hashes, dominios, URLs, IP:port y familias. Los IOC expiran; respetar freshness."

[[source]]
id = "urlhaus"
enabled = true
kind = "url_reputation"
base_url = "https://urlhaus.abuse.ch/api/"
lookup = "url"
auth = "header"
auth_env = "SST_URLHAUS_AUTH_KEY"
timeout_ms = 2500
cache_ttl_hours = 12
priority = 30
notes = "URLs relacionadas con distribución de malware. No aplica directamente a nombres de proceso."

[[source]]
id = "lolbas"
enabled = true
kind = "behavior_catalog"
base_url = "https://github.com/LOLBAS-Project/LOLBAS"
lookup = "binary_name"
auth = "none"
timeout_ms = 2500
cache_ttl_hours = 168
priority = 40
notes = "Contexto de binarios/scripts legítimos susceptibles de abuso. Coincidencia no implica malware."
